<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="saya.jpg">
    <title>Cat</title>
</head>
<body>
<header>
    <p><a href="https://t.me/catmeonmeoncat" style="text-decoration: none; color: inherit; cursor: pointer;">ФИО: Семенова Елена Вячеславовна</a></p>
    <p>Группа: P3213</p>
    <p>Вариант: 1488</p>
</header>
<section>
    <div class="cat">
        <form  id="pointForm">
            <div>
                <span>X:</span>
                <button type="button" class="x-btn" data-value="-2">-2</button>
                <button type="button" class="x-btn" data-value="-1.5">-1.5</button>
                <button type="button" class="x-btn" data-value="-1">-1</button>
                <button type="button" class="x-btn" data-value="-0.5">-0.5</button>
                <button type="button" class="x-btn" data-value="0">0</button>
                <button type="button" class="x-btn" data-value="0.5">0.5</button>
                <button type="button" class="x-btn" data-value="1">1</button>
                <button type="button" class="x-btn" data-value="1.5">1.5</button>
                <button type="button" class="x-btn" data-value="2">2</button>
            </div>
            <div>
                <label for="y-input">Y (от -3 до 3): </label>
                <input id="y-input" type="text" required name="y">
            </div>
            <div>
                <div>
                    <span>R:</span>
                    <label><input type="checkbox" name="r" value="1"> 1</label>
                    <label><input type="checkbox" name="r" value="1.5"> 1.5</label>
                    <label><input type="checkbox" name="r" value="2"> 2</label>
                    <label><input type="checkbox" name="r" value="2.5"> 2.5</label>
                    <label><input type="checkbox" name="r" value="3"> 3</label>
                </div>
                <div>
                    <span id="r-hint" style="color: #ffffff;">привет введи радиус</span>
                </div>
            </div>
            <button id="Change" type="submit" disabled>Нажми</button>
        </form>

        <canvas id="myCanvas" width="400" height="300"></canvas>
    </div>
    <div class="results">
        <div class="table-wrap">
            <table id="resultsTable">
                <thead>
                <tr>
                    <th>X</th>
                    <th>Y</th>
                    <th>R</th>
                    <th>Результат</th>
                    <th>Время сервера</th>
                    <th>Время работы скрипта, мс</th>
                </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>
</section>
<script src="script.js"></script>
</body>
</html>
